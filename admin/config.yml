# ═══════════════════════════════════════════════════
# Decap CMS Configuration
# This defines what your team can edit visually
# ═══════════════════════════════════════════════════
backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads/"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General"
        name: "general"
        file: "content/settings/general.json"
        fields:
          - { label: "Company Name", name: "company_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "SEO Image", name: "seo_image", widget: "image" }
          - { label: "Meta Description", name: "description", widget: "text" }

  - name: "hero"
    label: "Hero Section"
    file: "content/hero.json"
    fields:
      - { label: "Heading Line 1", name: "heading_1", widget: "string" }
      - { label: "Heading Line 2", name: "heading_2", widget: "string" }
      - { label: "Primary Button Text", name: "button_text", widget: "string" }

  - name: "services"
    label: "Services"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Service Name", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Icon", name: "icon", widget: "string" }

  - name: "testimonials"
    label: "Testimonials"
    folder: "content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Author Name", name: "author", widget: "string" }
      - { label: "Quote", name: "quote", widget: "text" }

  - name: "gallery"
    label: "Gallery Images"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Caption", name: "caption", widget: "string" }

  - name: "pages"
    label: "Pages"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
